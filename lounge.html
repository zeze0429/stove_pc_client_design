<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOVE 클라이언트 · 라운지</title>
  <!-- 로드 순서: tokens → foundations → typography → 아이콘 → GNB → 셸 -->
  <link rel="stylesheet" href="css/tokens.css?v=7" />
  <link rel="stylesheet" href="css/foundations.css?v=7" />
  <link rel="stylesheet" href="css/typography.css?v=12" />
  <link rel="stylesheet" href="css/stds-font-icon.embedded.css?v=8" />
  <link rel="stylesheet" href="css/gnb.css?v=79" />
  <link rel="stylesheet" href="css/dashboard.css?v=16" />
  <style>
    /* 클라이언트 메인 = 라운지 페이지 정적 스크린샷(다크모드).
       app-shell.html(스토어)과 동일한 방식 — 라이브 임베드 대신 헤드리스
       크롬으로 1040px/2x 레티나 다크모드 캡처, 최상단 공유 GNB(64px)는
       제거. 상단 48px / 하단 200px 여백. 배경은 라운지 자신의 실제
       body 배경(rgb(31,31,31) — 스토어/이벤트의 rgb(25,25,25)와는 다른 톤)과
       동일 토큰(--background-variant-2)으로 맞춤. 스크롤바도 store.onstove.com
       실제 구조(트랙 2.4rem, 보이는 썸 0.8rem) 그대로 재현 — app-shell.html 참고. */
    .app > .main {
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--background-variant-2);
      padding: 4.8rem 0 20rem;
    }
    .lounge-preview { display: block; width: 1040px; height: auto; }

    .app > .main::-webkit-scrollbar { width: 2.4rem; }
    .app > .main::-webkit-scrollbar-track { border-radius: var(--radius-full); }
    .app > .main::-webkit-scrollbar-thumb {
      border-radius: var(--radius-full);
      border: 0.8rem solid transparent;
      background-color: var(--inverse-elevation-2);
      background-clip: content-box;
    }
    .app > .main::-webkit-scrollbar-thumb:hover { background-color: var(--inverse-elevation-1); }
  </style>
</head>
<body>
  <div class="app">

    <!-- ============ GNB (STOVE layout/GNB · Figma 5705:58393) ============
         공통 Vue 컴포넌트(js/gnb-component.js)가 마운트되는 자리.
         마크업은 이제 여기 하드코딩하지 않음 — 구조를 고치려면 그 파일 하나만 수정. -->
    <div id="gnb-mount"></div>

    <!-- ============ MAIN (라운지 정적 스크린샷 — 다크모드 고정) ============ -->
    <div class="main">
      <img class="lounge-preview" src="assets/lounge-preview-dark.jpg?v=1" alt="STOVE 라운지 (다크모드 미리보기)" />
    </div>

  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/gnb-component.js?v=43"></script>
  <script>
    mountGnb('#gnb-mount');
  </script>
</body>
</html>
