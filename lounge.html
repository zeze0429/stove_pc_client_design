<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOVE 클라이언트 · 라운지</title>
  <!-- 로드 순서: tokens → foundations → typography → 아이콘 → GNB → 셸 -->
  <script src="js/proto-settings.js?v=25" data-client></script>
  <link rel="stylesheet" href="css/tokens.css?v=9" />
  <link rel="stylesheet" href="css/foundations.css?v=7" />
  <link rel="stylesheet" href="css/typography.css?v=12" />
  <link rel="stylesheet" href="css/stds-font-icon.embedded.css?v=8" />
  <link rel="stylesheet" href="css/gnb.css?v=94" />
  <link rel="stylesheet" href="css/dashboard.css?v=38" />
  <link rel="stylesheet" href="css/utility-bar.css?v=7" />
  <link rel="stylesheet" href="css/layer-dialog.css?v=5" />
  <link rel="stylesheet" href="css/pcbang-benefits.css?v=8" />
  <link rel="stylesheet" href="css/notification.css?v=8" />
  <link rel="stylesheet" href="css/profile-popup.css?v=5" />
  <link rel="stylesheet" href="css/stove-app-dialog.css?v=2" />
  <link rel="stylesheet" href="css/utility-notice.css?v=6" />
  <link rel="stylesheet" href="css/lounge.css?v=5" />
  <style>
    /* 클라이언트 메인 = 라운지 "오늘의 1등". 예전엔 웹 캡처 이미지 3장이었는데
       지금은 실제 웹을 실측해 직접 그린 컴포넌트(js/lounge-component.js,
       css/lounge.css)라 다크/라이트가 토큰으로 바로 바뀐다.
       3단 간격은 실제 네이티브 클라이언트 기준:
       사이드바-레일 4 / 레일 64 / 52 / 가운데 520 / 56 / 오른쪽 280 / 64.
       배경: 실제 라운지는 다크 gray-880 / 라이트 gray-20. 다크는 스토어 메인과
       같은 background-variant-1로 통일, 라이트는 웹 원래 색(gray-20) 그대로 —
       검색 인풋(라이트 neutral-variant-2-hover)이 배경과 구분돼야 해서. */
    .app > .main {
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--background-variant-1);
      padding: calc(4.8rem + var(--utility-notice-h, 0px)) 6.4rem 0 0.4rem;
      display: block;
    }
    :root[data-theme="light"] .app > .main { background: var(--stove-gray-20); }

    /* 플로팅 버튼(글쓰기 · 맨 위로) — 실제 라운지 웹 캡처(그림자 포함 투명 PNG).
       오른쪽 여백 40 — 스토어·이벤트 콘텐츠의 좌우 여백(40)과 같은 선에 둔다
       (라운지 칼럼 여백 64나 웹 값 44가 아니라 다른 페이지 기준).
       아래 20, 버튼 40 · 간격 16. 캡처 이미지는 버튼 바깥으로 그림자 여백이
       위·좌우 16만큼 있어서 그만큼 당겨 놓는다. 이미지 위에 투명 버튼을 겹쳐
       "맨 위로"는 실제로 스크롤을 올린다. */
    .lounge-fab {
      position: absolute;
      z-index: 15;
      right: 4rem;
      bottom: 2rem;
      width: 4rem;
      height: 9.6rem;
    }
    .lounge-fab img {
      position: absolute;
      left: -1.6rem;
      top: -1.6rem;
      width: 7.2rem;
      pointer-events: none;
    }
    .lounge-fab__btn {
      position: absolute;
      left: 0;
      width: 4rem;
      height: 4rem;
      padding: 0;
      border: 0;
      border-radius: var(--radius-full);
      background: transparent;
      cursor: pointer;
    }
    .lounge-fab__btn--write { top: 0; }
    .lounge-fab__btn--top { top: 5.6rem; }

  </style>
</head>
<body>
  <div class="app">

    <!-- ============ GNB (STOVE layout/GNB · Figma 5705:58393) ============
         공통 Vue 컴포넌트(js/gnb-component.js)가 마운트되는 자리.
         마크업은 이제 여기 하드코딩하지 않음 — 구조를 고치려면 그 파일 하나만 수정. -->
    <div id="gnb-mount"></div>

    <!-- ============ 유틸리티 바 (Figma layout/utility_bar · 3031:50773) ============
         콘텐츠 영역 위에 떠 있는 레이어. 공통 Vue 컴포넌트
         (js/utility-bar-component.js)가 마운트되는 자리. -->
    <div id="utility-bar-mount"></div>

    <!-- ============ MAIN (라운지 정적 스크린샷 — 3단 분할, 좌/우 고정, 테마별 한 쌍) ============ -->
    <div class="main main--overlay-scroll">
      <!-- 라운지 3단 (js/lounge-component.js) -->
      <div id="lounge-mount"></div>
    </div>

    <!-- 플로팅 버튼 (라운지 웹 캡처) -->
    <div class="lounge-fab">
      <img class="theme-img--dark" src="assets/lounge-fab-dark.png?v=1" alt="" aria-hidden="true" />
      <img class="theme-img--light" src="assets/lounge-fab-light.png?v=1" alt="" aria-hidden="true" loading="lazy" />
      <button class="lounge-fab__btn lounge-fab__btn--write" type="button" aria-label="글쓰기"></button>
      <button class="lounge-fab__btn lounge-fab__btn--top" type="button" aria-label="맨 위로"
        onclick="document.querySelector('.app > .main').scrollTo({ top: 0, behavior: 'smooth' })"></button>
    </div>

  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/game-catalog.js?v=7"></script>
  <script src="js/gnb-component.js?v=62"></script>
  <script src="js/layer-dialog-component.js?v=2"></script>
  <script src="js/pcbang-benefits-component.js?v=5"></script>
  <script src="js/notification-component.js?v=4"></script>
  <script src="js/profile-popup-component.js?v=5"></script>
  <script src="js/stove-app-dialog-component.js?v=2"></script>
  <script src="js/utility-notice-component.js?v=3"></script>
  <script src="js/utility-bar-component.js?v=13"></script>
  <script src="js/lounge-component.js?v=4"></script>
  <script src="js/page-scrollbar.js?v=2"></script>
  <script>
    mountGnb('#gnb-mount');
    mountUtilityBar('#utility-bar-mount');
    mountLoungeMain('#lounge-mount');
    mountPageScrollbar(document.querySelector('.app > .main'));
  </script>
</body>
</html>
