<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOVE 클라이언트 · 라운지</title>
  <!-- 로드 순서: tokens → foundations → typography → 아이콘 → GNB → 셸 -->
  <script src="js/proto-settings.js?v=37" data-client></script>
  <link rel="stylesheet" href="css/tokens.css?v=19" />
  <link rel="stylesheet" href="css/foundations.css?v=15" />
  <link rel="stylesheet" href="css/typography.css?v=12" />
  <link rel="stylesheet" href="css/stds-font-icon.embedded.css?v=9" />
  <link rel="stylesheet" href="css/button.css?v=5" />
  <link rel="stylesheet" href="css/gnb.css?v=118" />
  <link rel="stylesheet" href="css/dashboard.css?v=54" />
  <link rel="stylesheet" href="css/utility-bar.css?v=10" />
  <link rel="stylesheet" href="css/layer-dialog.css?v=12" />
  <link rel="stylesheet" href="css/pcbang-benefits.css?v=13" />
  <link rel="stylesheet" href="css/notification.css?v=15" />
  <link rel="stylesheet" href="css/profile-popup.css?v=11" />
  <link rel="stylesheet" href="css/stove-app-dialog.css?v=5" />
  <link rel="stylesheet" href="css/utility-notice.css?v=12" />
  <link rel="stylesheet" href="css/lounge.css?v=13" />
  <style>
    /* 라운지 홈 — 실제 lounge.onstove.com/ko 를 실측해 직접 그린 컴포넌트(js/lounge-component.js,
       css/lounge.css). 좌우 배치는 컴포넌트가 웹 반응형 그대로 잡으므로 .main은 위 여백(유틸리티 바)만.
       배경은 다른 페이지와 같은 background-variant-1 (사용자 11-17). */
    .app > .main {
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--stds-sem-color-background-variant-1);
      padding: calc(4.8rem + var(--utility-notice-h, 0px)) 0 0;
      display: block;
    }

    /* 플로팅 버튼 — 현재 라운지 웹 그대로 코드로 (예전 캡처 이미지 대신, 사용자 11-17).
       오른쪽 아래 여백 20 · 버튼 사이 16. 위: 맨 위로 40 원형(surface-fab, 아이콘 16, shadow 4).
       아래: 글쓰기 — 맨 위에서는 "글쓰기 + 연필" 알약, 아래로 스크롤하면 0.2초 동안 접혀 연필만 남은 40 원형
       (웹: 글자 칸 grid-template-columns 1fr ↔ 0fr). */
    .lounge-fab {
      position: absolute;
      z-index: 15;
      right: 2rem;
      bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1.6rem;
    }
    .lounge-fab__top,
    .lounge-fab__write {
      display: flex;
      align-items: center;
      height: 4rem;
      border-radius: var(--stds-glob-border-radius-full);
      box-shadow: var(--stds-glob-box-shadow-4);
      cursor: pointer;
    }
    .lounge-fab__top {
      justify-content: center;
      width: 4rem;
      padding: 0;
      background: var(--stds-sem-color-surface-fab);
      color: var(--stds-sem-color-on-surface-elevation-3);
    }
    .lounge-fab__top:active { background: var(--stds-sem-color-surface-fab-pressed); }
    .lounge-fab__top i,
    .lounge-fab__write i { display: block; flex-shrink: 0; font-size: 1.6rem; line-height: 1; }
    .lounge-fab__write {
      justify-content: flex-end;
      padding: 0 1.2rem;
      background: var(--stds-sem-color-brand-primary);
      color: var(--stds-glob-color-white);
    }
    .lounge-fab__label {
      display: grid;
      grid-template-columns: 1fr;
      transition: grid-template-columns 0.2s ease-out;
    }
    .lounge-fab__label > span { min-width: 0; overflow: hidden; }
    .lounge-fab__label b { display: block; padding-right: 0.4rem; font-size: 1.4rem; font-weight: 700; line-height: 2rem; white-space: nowrap; }
    .lounge-fab.is-scrolled .lounge-fab__label { grid-template-columns: 0fr; }
    @media (prefers-reduced-motion: reduce) { .lounge-fab__label { transition: none; } }

  </style>
</head>
<body>
  <div class="app">

    <!-- ============ GNB (STOVE layout/GNB · Figma 5705:58393) ============
         공통 Vue 컴포넌트(js/gnb-component.js)가 마운트되는 자리.
         마크업은 이제 여기 하드코딩하지 않음 — 구조를 고치려면 그 파일 하나만 수정. -->
    <div id="gnb-mount"></div>

    <!-- ============ 유틸리티 바 (Figma layout/utility_bar · 3031:50773) ============
         콘텐츠 영역 위에 떠 있는 레이어. 공통 Vue 컴포넌트
         (js/utility-bar-component.js)가 마운트되는 자리. -->
    <div id="utility-bar-mount"></div>

    <!-- ============ MAIN (라운지 홈 — js/lounge-component.js) ============ -->
    <div class="main main--overlay-scroll">
      <!-- 라운지 홈 — 1단 메뉴 · 2단 피드 · 3단 프로필/인기글 (js/lounge-component.js) -->
      <div id="lounge-mount"></div>
    </div>

    <!-- 플로팅 버튼 (현재 라운지 웹) — 맨 위로 · 글쓰기(스크롤하면 접힘) -->
    <div class="lounge-fab">
      <button class="lounge-fab__top" type="button" aria-label="맨 위로"
        onclick="document.querySelector('.app > .main').scrollTo({ top: 0, behavior: 'smooth' })"><i class="ic-v2-control-top-line" aria-hidden="true"></i></button>
      <button class="lounge-fab__write" type="button" aria-label="글쓰기">
        <span class="lounge-fab__label"><span><b>글쓰기</b></span></span>
        <i class="ic-v2-community-pencil-fill" aria-hidden="true"></i>
      </button>
    </div>

  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/game-catalog.js?v=11"></script>
  <script src="js/download-sim.js?v=14"></script>
  <script src="js/gnb-component.js?v=83"></script>
  <script src="js/layer-dialog-component.js?v=5"></script>
  <script src="js/pcbang-benefits-component.js?v=6"></script>
  <script src="js/notification-component.js?v=5"></script>
  <script src="js/profile-popup-component.js?v=7"></script>
  <script src="js/stove-app-dialog-component.js?v=3"></script>
  <script src="js/utility-notice-component.js?v=7"></script>
  <script src="js/utility-bar-component.js?v=15"></script>
  <script src="js/lounge-component.js?v=6"></script>
  <script src="js/page-scrollbar.js?v=3"></script>
  <script>
    mountGnb('#gnb-mount');
    mountUtilityBar('#utility-bar-mount');
    mountLoungeMain('#lounge-mount');
    mountPageScrollbar(document.querySelector('.app > .main'));
    // 글쓰기 버튼 — 맨 위에서만 글자까지 펼침, 내려가면 연필만 (라운지 웹 그대로)
    (function () {
      var main = document.querySelector('.app > .main'), fab = document.querySelector('.lounge-fab');
      function sync() { fab.classList.toggle('is-scrolled', main.scrollTop > 0); }
      main.addEventListener('scroll', sync, { passive: true });
      sync();
    })();
  </script>
</body>
</html>
