<!DOCTYPE html>

  <title>STOVE 클라이언트 · 라운지</title>
  <!-- 로드 순서: tokens → foundations → typography → 아이콘 → GNB → 셸 -->
  <script src="js/proto-settings.js?v=4" data-client></script>
  <link rel="stylesheet" href="css/tokens.css?v=7" />
  <link rel="stylesheet" href="css/foundations.css?v=7" />
  <link rel="stylesheet" href="css/typography.css?v=12" />
  <link rel="stylesheet" href="css/stds-font-icon.embedded.css?v=8" />
  <link rel="stylesheet" href="css/gnb.css?v=82" />
  <link rel="stylesheet" href="css/dashboard.css?v=26" />
  <link rel="stylesheet" href="css/utility-bar.css?v=5" />
  <link rel="stylesheet" href="css/layer-dialog.css?v=4" />
  <link rel="stylesheet" href="css/pcbang-benefits.css?v=6" />
  <link rel="stylesheet" href="css/notification.css?v=7" />
  <link rel="stylesheet" href="css/profile-popup.css?v=4" />
  <link rel="stylesheet" href="css/stove-app-dialog.css?v=2" />
  <link rel="stylesheet" href="css/utility-notice.css?v=4" />
  <style>
    /* 클라이언트 메인 = 라운지 페이지 정적 스크린샷(다크·라이트 한 쌍).
       캡처 방식은 app-shell.html(스토어) 주석 참고. 라운지는 시스템 설정이
       아니라 COLOR_MODE 쿠키로만 테마가 바뀌어 캡처할 때 쿠키로 다크를 연다.
       라운지만은 웹 스크롤바가 있는 1016 레이아웃으로 찍는다 — 스크롤바가
       없으면 가운데 피드가 544로 넓어져 아래 실측 간격(피드 520 기준)이 깨진다.
       배경: 실제 라운지는 다크 gray-880 / 라이트 gray-20이라 스토어·이벤트와
       다른데, 클라이언트에서는 스토어 메인과 같은 background-variant-1로
       통일한다 — 캡처할 때 웹 배경을 그 색으로 바꿔서 찍었다.
       app-shell.html(스토어)과 동일한 방식 — 라이브 임베드 대신 헤드리스
       크롬으로 1040px/2x 레티나 다크모드 캡처, 최상단 공유 GNB(64px)는
       제거. 상단 48px / 하단 200px 여백. 스크롤바는 오버레이(js/page-scrollbar.js).

       실제 라운지는 3단 구성 — 좌: 아이콘 레일 72px / (56px 간격) /
       가운데: 피드 520px / (56px 간격) / 우: 검색·추천 280px.
       처음엔 원본 스크린샷을 "박스 바깥 경계" 기준(72px~672px 등)으로
       잘랐는데, 그 박스 안쪽에 자체 padding(가운데 피드는 main 태그에
       32px, 우측 aside는 24px)이 이미 포함돼 있어서 우리가 또 간격을
       더하면 이중으로 여백이 생기거나(간격이 너무 벌어짐), 반대로 더
       좁게 자르면 배지 같은 실제 콘텐츠가 잘려나가는 문제가 있었음.
       그래서 DOM에서 실제 콘텐츠 박스(배지/검색창이 꽉 차는 안쪽
       padding box) 자체의 좌표를 직접 재서(가운데 120px~640px=520px
       폭) 그 "콘텐츠만" 잘라내고, 간격은 우리가 CSS로 깨끗하게 56px씩
       새로 준다. 좌·우 단은 position:sticky로 고정된 채 가운데만
       스크롤된다 — 이걸 정적 이미지 한 장으로 캡처하면 스크롤할 때
       좌우도 같이 밀려 올라가서 실제 사이트와 다르게 보임. 좌·우
       이미지에 직접 position:sticky를 줘서 실제
       사이트와 동일하게 가운데만 스크롤되게 재현. sticky가 끝까지 붙어
       있으려면 좌·우 열을 감싸는 wrapper가 가운데 열 이미지(2536px)와 같은
       높이여야 하는데, align-items:stretch(flex 기본값)에 맡기면 될
       것 같지만 실제로는 overflow:auto인 flex 컨테이너 안에서 늘어나지
       않는 걸 확인(크로스 사이즈가 뷰포트 높이로 묶이는 문제로 추정) —
       그래서 가운데 열과 동일한 값을 좌·우 wrapper에 직접
       height로 명시. 가운데 열 이미지 높이가 바뀌면 이 값도 같이
       맞춰야 함. 우측 열 이미지는 실제 사이트 자체 푸터(Smilegate)
       앞에서 잘라 제외(스토어/이벤트와 동일한 규칙). */
    .app > .main {
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--background-variant-1); /* 스토어 메인과 동일 — 위 주석 참고 */
      /* 좌: 사이드바-아이콘레일 4px / 우: 우측열 뒤 64px — 실제 네이티브
         클라이언트 캡처에 직접 그려서 받은 정확한 수치. 하단은 0 —
         라운지는 실제로 무한 스크롤 피드라서 스토어/이벤트처럼 "콘텐츠
         끝 + 200px 여백"을 두면 어색함(끝이 있는 것처럼 보임). */
      padding: calc(4.8rem + var(--utility-notice-h, 0px)) 6.4rem 0 0.4rem;
      display: flex;
      flex-direction: row; /* 공통 셸 기본값(column)을 3단 레이아웃용으로 덮어씀 */
    }
    /* 1단-2단 간격 52px, 2단-3단 간격 56px — 실측 결과 둘이 다름 */
    .lounge-col-center { flex: 0 0 auto; margin-left: 5.2rem; }
    .lounge-col-right { flex: 0 0 auto; margin-left: 5.6rem; }
    .lounge-col-left,
    .lounge-col-right { height: 253.6rem; }
    .lounge-col-left img,
    .lounge-col-right img { position: sticky; top: 0; display: block; }
    .lounge-col-left img { width: 6.4rem; }
    .lounge-col-center img { display: block; width: 52rem; }
    .lounge-col-right img { width: 28rem; }
    /* 3단 검색창 윗변을 2단 "집계 종료까지" 글자 윗변에 맞춘다(이미지 실측 11px).
       sticky 기준도 같이 내려야 스크롤 중에도 같은 높이를 유지한다. */
    .lounge-col-right { padding-top: 1.1rem; }
    .lounge-col-right img { top: 1.1rem; }

  </style>
</head>
<body>
  <div class="app">

    <!-- ============ GNB (STOVE layout/GNB · Figma 5705:58393) ============
         공통 Vue 컴포넌트(js/gnb-component.js)가 마운트되는 자리.
         마크업은 이제 여기 하드코딩하지 않음 — 구조를 고치려면 그 파일 하나만 수정. -->
    <div id="gnb-mount"></div>

    <!-- ============ 유틸리티 바 (Figma layout/utility_bar · 3031:50773) ============
         콘텐츠 영역 위에 떠 있는 레이어. 공통 Vue 컴포넌트
         (js/utility-bar-component.js)가 마운트되는 자리. -->
    <div id="utility-bar-mount"></div>

    <!-- ============ MAIN (라운지 정적 스크린샷 — 3단 분할, 좌/우 고정, 테마별 한 쌍) ============ -->
    <div class="main main--overlay-scroll">
      <div class="lounge-col-left">
        <img class="theme-img--dark" src="assets/lounge-left-dark.jpg?v=3" alt="" aria-hidden="true" loading="lazy" />
        <img class="theme-img--light" src="assets/lounge-left-light.jpg?v=2" alt="" aria-hidden="true" loading="lazy" />
      </div>
      <div class="lounge-col-center">
        <img class="theme-img--dark" src="assets/lounge-center-dark.jpg?v=6" alt="STOVE 라운지 미리보기" loading="lazy" />
        <img class="theme-img--light" src="assets/lounge-center-light.jpg?v=2" alt="STOVE 라운지 미리보기" loading="lazy" />
      </div>
      <div class="lounge-col-right">
        <img class="theme-img--dark" src="assets/lounge-right-dark.jpg?v=4" alt="" aria-hidden="true" loading="lazy" />
        <img class="theme-img--light" src="assets/lounge-right-light.jpg?v=2" alt="" aria-hidden="true" loading="lazy" />
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/gnb-component.js?v=46"></script>
  <script src="js/layer-dialog-component.js?v=2"></script>
  <script src="js/pcbang-benefits-component.js?v=2"></script>
  <script src="js/notification-component.js?v=4"></script>
  <script src="js/profile-popup-component.js?v=4"></script>
  <script src="js/stove-app-dialog-component.js?v=2"></script>
  <script src="js/utility-notice-component.js?v=3"></script>
  <script src="js/utility-bar-component.js?v=11"></script>
  <script src="js/page-scrollbar.js?v=2"></script>
  <script>
    mountGnb('#gnb-mount');
    mountUtilityBar('#utility-bar-mount');
    mountPageScrollbar(document.querySelector('.app > .main'));
  </script>
</body>
</html>
