<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOVE 클라이언트 · 라이브러리</title>
  <!-- 로드 순서: tokens → foundations → typography → 아이콘 → GNB → 셸 -->
  <script src="js/proto-settings.js?v=24" data-client></script>
  <link rel="stylesheet" href="css/tokens.css?v=9" />
  <link rel="stylesheet" href="css/foundations.css?v=7" />
  <link rel="stylesheet" href="css/typography.css?v=12" />
  <link rel="stylesheet" href="css/stds-font-icon.embedded.css?v=8" />
  <link rel="stylesheet" href="css/gnb.css?v=93" />
  <link rel="stylesheet" href="css/dashboard.css?v=36" />
  <link rel="stylesheet" href="css/utility-bar.css?v=7" />
  <link rel="stylesheet" href="css/layer-dialog.css?v=4" />
  <link rel="stylesheet" href="css/pcbang-benefits.css?v=6" />
  <link rel="stylesheet" href="css/notification.css?v=7" />
  <link rel="stylesheet" href="css/profile-popup.css?v=4" />
  <link rel="stylesheet" href="css/stove-app-dialog.css?v=2" />
  <link rel="stylesheet" href="css/utility-notice.css?v=5" />
  <link rel="stylesheet" href="css/library.css?v=13" />
</head>
<body>
  <div class="app app--client app--panel-always">

    <!-- ============ GNB (STOVE layout/GNB · Figma 5705:58393) ============
         공통 Vue 컴포넌트(js/gnb-component.js)가 마운트되는 자리.
         마크업은 이제 여기 하드코딩하지 않음 — 구조를 고치려면 그 파일 하나만 수정. -->
    <div id="gnb-mount"></div>

    <!-- ============ 유틸리티 바 (Figma layout/utility_bar · 3031:50773) ============
         콘텐츠 영역 위에 떠 있는 레이어. 공통 Vue 컴포넌트
         (js/utility-bar-component.js)가 마운트되는 자리. -->
    <div id="utility-bar-mount"></div>

    <!-- ============ 라이브러리 (Figma 2026_웹전환 11735:51868) ============
         콘텐츠(MD_container) + 우측패널 280 — 클라이언트 레이아웃 공통(css/dashboard.css).
         라이브러리는 패널을 항상 쓴다(app--panel-always) — 보기 옵션 "우측패널"과 무관 -->
    <div class="main main--overlay-scroll" data-name="MD_container">
      <div class="client-page-title" data-name="page_title">
        <h1 class="client-page-title__text">라이브러리</h1>
        <button class="client-page-title__setting" type="button" aria-label="라이브러리 설정"><i class="ic-v2-navigation-setting-fill"></i></button>
      </div>
      <div id="library-mount"></div>
    </div>
    <aside class="client-panel" aria-label="내 게임 폴더" data-name="Pannel Area"></aside>

  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/game-catalog.js?v=6"></script>
  <script src="js/gnb-component.js?v=62"></script>
  <script src="js/layer-dialog-component.js?v=2"></script>
  <script src="js/pcbang-benefits-component.js?v=4"></script>
  <script src="js/notification-component.js?v=4"></script>
  <script src="js/profile-popup-component.js?v=5"></script>
  <script src="js/stove-app-dialog-component.js?v=2"></script>
  <script src="js/utility-notice-component.js?v=3"></script>
  <script src="js/utility-bar-component.js?v=13"></script>
  <script src="js/library-component.js?v=11"></script>
  <script src="js/page-scrollbar.js?v=2"></script>
  <script>
    mountGnb('#gnb-mount');
    mountUtilityBar('#utility-bar-mount');
    mountLibraryMain('#library-mount');
    mountPageScrollbar(document.querySelector('.app > .main'));
  </script>
</body>
</html>
