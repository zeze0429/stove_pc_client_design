<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOVE 클라이언트</title>
  <!-- 로드 순서: tokens → foundations → typography → 아이콘 → GNB → 셸 -->
  <script src="js/proto-settings.js?v=7" data-client></script>
  <link rel="stylesheet" href="css/tokens.css?v=7" />
  <link rel="stylesheet" href="css/foundations.css?v=7" />
  <link rel="stylesheet" href="css/typography.css?v=12" />
  <link rel="stylesheet" href="css/stds-font-icon.embedded.css?v=8" />
  <link rel="stylesheet" href="css/gnb.css?v=88" />
  <link rel="stylesheet" href="css/dashboard.css?v=27" />
  <link rel="stylesheet" href="css/utility-bar.css?v=5" />
  <link rel="stylesheet" href="css/layer-dialog.css?v=4" />
  <link rel="stylesheet" href="css/pcbang-benefits.css?v=6" />
  <link rel="stylesheet" href="css/notification.css?v=7" />
  <link rel="stylesheet" href="css/profile-popup.css?v=4" />
  <link rel="stylesheet" href="css/stove-app-dialog.css?v=2" />
  <link rel="stylesheet" href="css/utility-notice.css?v=4" />
  <style>
    /* 클라이언트 메인 = 스토어 페이지 정적 스크린샷(다크·라이트 한 쌍).
       ※ 한때 실제 웹을 iframe으로 라이브 임베드했다가(2026-10) 되돌렸다 —
       크로스 오리진이라 유틸리티 바 블러(스크롤 감지)·웹 스크롤바 처리·
       라운지 다크 전환이 전부 불가능했음.
       다크/라이트 두 장은 한 번 연 페이지에서 테마만 바꿔 연달아 캡처해
       배너·섹션 문구까지 내용이 완전히 같다. 스크롤바 없는 1040 폭으로
       찍고, 페이지 스크롤바는 폭을 차지하지 않는 오버레이(js/page-scrollbar.js)라
       이미지가 1040 그대로 들어간다. 페이지 끝(사이트 푸터 앞)까지 찍어서
       마지막 캐러셀 화살표까지 온전하다.
       처음엔 실제 store.onstove.com을 iframe으로 라이브 임베드했었는데:
       1) 최상단 지엔비·푸터는 크로스 오리진이라 크롭이 불가능하거나(푸터는
          콘텐츠 길이가 화면 폭마다 달라져서 고정 크롭이 다른 폭에서 깨짐),
       2) 다크모드도 "보는 사람 시스템 설정"을 그대로 따라가서, 시스템이
          라이트면 라이트로 뜨는 걸 부모 페이지에서 강제로 못 바꿈(크로스
          오리진 iframe 보안 경계라 CSS/쿠키 어느 쪽으로도 우회 불가, CORS도
          안 열려 있어 HTML을 가져와 고쳐 넣는 것도 불가능했음).
       → 라이브 임베드를 포기하고, 다크모드로 직접 캡처한 화면(최상단
       지엔비 제거, assets/store-preview-dark.jpg)을 정적 이미지로 넣음 —
       이러면 테마/크롭 둘 다 항상 의도한 대로 고정됨.
       클라이언트 최소 폭(1280, 사이드바 240 제외 1040)에 맞춰 1040px
       뷰포트로 캡처했고, width도 1040 고정 — 100%로 늘려서 더 넓은 화면에
       맞게 늘어나면(실제로 해보니 블러지고 내용도 부족해 보임) 안 되므로
       항상 이 1040 고정 크기로만 보여주고, 더 넓은 창에서는 옆에 배경색만
       추가로 보임(사이드바 폭이 고정인 것과 같은 방식).
       레티나 대응: 원본 파일 자체를 2x(2080px 폭, --force-device-scale-factor=2로
       캡처)로 만들어두고 CSS로는 1040px에 표시 — 그래서 고밀도(레티나) 디스플레이에서도
       안 흐려짐. */
    .app > .main {
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--background-variant-1); /* store.onstove.com 실제 body 배경(rgb(25,25,25))과 동일 토큰 */
      padding: calc(4.8rem + var(--utility-notice-h, 0px)) 0 10rem; /* 상단 = 유틸리티 바 + 공지 띠 / 하단 100px */
    }
    .store-preview { display: block; width: 1040px; height: auto; }

    /* 맨 위로 버튼 — 실제 스토어 웹 캡처(그림자 포함 투명 PNG).
       웹처럼 어느 정도(300) 스크롤해야 나타난다: 숨김 상태에선 투명하고
       40 아래에 있다가 0.2초 동안 제자리로 올라온다(웹은 margin-bottom 전환).
       자리는 라운지 플로팅 버튼과 같은 오른쪽 40 / 아래 20. 캡처 이미지는
       버튼 바깥 그림자 여백 16만큼 당겨 놓는다. */
    .store-fab-top {
      position: absolute;
      z-index: 15;
      right: 4rem;
      bottom: 2rem;
      width: 4rem;
      height: 4rem;
      padding: 0;
      border: 0;
      border-radius: var(--radius-full);
      background: transparent;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4rem);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .store-fab-top.is-visible { opacity: 1; pointer-events: auto; transform: none; }
    .store-fab-top img {
      position: absolute;
      left: -1.6rem;
      top: -1.6rem;
      width: 7.2rem;
      pointer-events: none;
    }

  </style>
</head>
<body>
  <div class="app">

    <!-- ============ GNB (STOVE layout/GNB · Figma 5705:58393) ============
         공통 Vue 컴포넌트(js/gnb-component.js)가 마운트되는 자리.
         마크업은 이제 여기 하드코딩하지 않음 — 구조를 고치려면 그 파일 하나만 수정. -->
    <div id="gnb-mount"></div>

    <!-- ============ 유틸리티 바 (Figma layout/utility_bar · 3031:50773) ============
         콘텐츠 영역 위에 떠 있는 레이어. 공통 Vue 컴포넌트
         (js/utility-bar-component.js)가 마운트되는 자리. -->
    <div id="utility-bar-mount"></div>

    <!-- ============ MAIN (store 정적 스크린샷 — 테마별 한 쌍) ============ -->
    <div class="main main--overlay-scroll">
      <img class="store-preview theme-img--dark" src="assets/store-preview-dark.jpg?v=2" alt="STOVE 스토어 미리보기" loading="lazy" />
      <img class="store-preview theme-img--light" src="assets/store-preview-light.jpg?v=2" alt="STOVE 스토어 미리보기" loading="lazy" />
    </div>

    <!-- 맨 위로 (스토어 웹 캡처) — 300 넘게 스크롤하면 나타난다 -->
    <button class="store-fab-top" type="button" aria-label="맨 위로"
      onclick="document.querySelector('.app > .main').scrollTo({ top: 0, behavior: 'smooth' })">
      <img class="theme-img--dark" src="assets/store-fab-top-dark.png?v=1" alt="" aria-hidden="true" />
      <img class="theme-img--light" src="assets/store-fab-top-light.png?v=1" alt="" aria-hidden="true" loading="lazy" />
    </button>

  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/gnb-component.js?v=52"></script>
  <script src="js/layer-dialog-component.js?v=2"></script>
  <script src="js/pcbang-benefits-component.js?v=2"></script>
  <script src="js/notification-component.js?v=4"></script>
  <script src="js/profile-popup-component.js?v=4"></script>
  <script src="js/stove-app-dialog-component.js?v=2"></script>
  <script src="js/utility-notice-component.js?v=3"></script>
  <script src="js/utility-bar-component.js?v=11"></script>
  <script src="js/page-scrollbar.js?v=2"></script>
  <script>
    mountGnb('#gnb-mount');
    mountUtilityBar('#utility-bar-mount');
    mountPageScrollbar(document.querySelector('.app > .main'));
    // 맨 위로 버튼 — 웹 스토어처럼 300 넘게 내려가면 나타난다
    (function () {
      var main = document.querySelector('.app > .main');
      var fab = document.querySelector('.store-fab-top');
      function sync() { fab.classList.toggle('is-visible', main.scrollTop > 300); }
      main.addEventListener('scroll', sync, { passive: true });
      sync();
    })();
  </script>
</body>
</html>
