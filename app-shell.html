<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOVE 클라이언트</title>
  <!-- 로드 순서: tokens → foundations → typography → 아이콘 → GNB → 셸 -->
  <link rel="stylesheet" href="css/tokens.css?v=7" />
  <link rel="stylesheet" href="css/foundations.css?v=7" />
  <link rel="stylesheet" href="css/typography.css?v=12" />
  <link rel="stylesheet" href="css/stds-font-icon.embedded.css?v=8" />
  <link rel="stylesheet" href="css/gnb.css?v=79" />
  <link rel="stylesheet" href="css/dashboard.css?v=17" />
  <link rel="stylesheet" href="css/utility-bar.css?v=3" />
  <link rel="stylesheet" href="css/pcbang-benefits.css?v=2" />
  <style>
    /* 클라이언트 메인 = 스토어 페이지 정적 스크린샷(다크모드).
       처음엔 실제 store.onstove.com을 iframe으로 라이브 임베드했었는데:
       1) 최상단 지엔비·푸터는 크로스 오리진이라 크롭이 불가능하거나(푸터는
          콘텐츠 길이가 화면 폭마다 달라져서 고정 크롭이 다른 폭에서 깨짐),
       2) 다크모드도 "보는 사람 시스템 설정"을 그대로 따라가서, 시스템이
          라이트면 라이트로 뜨는 걸 부모 페이지에서 강제로 못 바꿈(크로스
          오리진 iframe 보안 경계라 CSS/쿠키 어느 쪽으로도 우회 불가, CORS도
          안 열려 있어 HTML을 가져와 고쳐 넣는 것도 불가능했음).
       → 라이브 임베드를 포기하고, 다크모드로 직접 캡처한 화면(최상단
       지엔비 제거, assets/store-preview-dark.jpg)을 정적 이미지로 넣음 —
       이러면 테마/크롭 둘 다 항상 의도한 대로 고정됨.
       클라이언트 최소 폭(1280, 사이드바 240 제외 1040)에 맞춰 1040px
       뷰포트로 캡처했고, width도 1040 고정 — 100%로 늘려서 더 넓은 화면에
       맞게 늘어나면(실제로 해보니 블러지고 내용도 부족해 보임) 안 되므로
       항상 이 1040 고정 크기로만 보여주고, 더 넓은 창에서는 옆에 배경색만
       추가로 보임(사이드바 폭이 고정인 것과 같은 방식).
       레티나 대응: 원본 파일 자체를 2x(2080px 폭, --force-device-scale-factor=2로
       캡처)로 만들어두고 CSS로는 1040px에 표시 — 그래서 고밀도(레티나) 디스플레이에서도
       안 흐려짐. */
    .app > .main {
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--background-variant-1); /* store.onstove.com 실제 body 배경(rgb(25,25,25))과 동일 토큰 */
      padding: 4.8rem 0 20rem; /* 이미지 상단 48px / 하단 200px 여백 */
    }
    .store-preview { display: block; width: 1040px; height: auto; }

    /* 스크롤바 — store.onstove.com(실제 웹)의 body 스크롤바와 동일한 구조/수치로 재현.
       실제 페이지는 .inds-scrollbar-theme-8을 써서 트랙 2.4rem에 썸은
       0.8rem solid transparent 보더 + background-clip:content-box로 가운데
       0.8rem만 색이 보이게 만드는 방식 — 사이드바(.gnb-scrollbar, 0.4rem 오버레이
       방식)와는 다른 구조라서 그대로 복제. 색상은 동일 컨벤션(default=inverse-elevation-2,
       hover=inverse-elevation-1). */
    .app > .main::-webkit-scrollbar { width: 2.4rem; }
    .app > .main::-webkit-scrollbar-track { border-radius: var(--radius-full); }
    .app > .main::-webkit-scrollbar-thumb {
      border-radius: var(--radius-full);
      border: 0.8rem solid transparent;
      background-color: var(--inverse-elevation-2);
      background-clip: content-box;
    }
    .app > .main::-webkit-scrollbar-thumb:hover { background-color: var(--inverse-elevation-1); }
  </style>
</head>
<body>
  <div class="app">

    <!-- ============ GNB (STOVE layout/GNB · Figma 5705:58393) ============
         공통 Vue 컴포넌트(js/gnb-component.js)가 마운트되는 자리.
         마크업은 이제 여기 하드코딩하지 않음 — 구조를 고치려면 그 파일 하나만 수정. -->
    <div id="gnb-mount"></div>

    <!-- ============ 유틸리티 바 (Figma layout/utility_bar · 3031:50773) ============
         콘텐츠 영역 위에 떠 있는 레이어. 공통 Vue 컴포넌트
         (js/utility-bar-component.js)가 마운트되는 자리. -->
    <div id="utility-bar-mount"></div>

    <!-- ============ MAIN (store 정적 스크린샷 — 다크모드 고정) ============ -->
    <div class="main">
      <img class="store-preview" src="assets/store-preview-dark.jpg" alt="STOVE 스토어 (다크모드 미리보기)" />
    </div>

  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/gnb-component.js?v=43"></script>
  <script src="js/pcbang-benefits-component.js?v=1"></script>
  <script src="js/utility-bar-component.js?v=5"></script>
  <script>
    mountGnb('#gnb-mount');
    mountUtilityBar('#utility-bar-mount');
  </script>
</body>
</html>
