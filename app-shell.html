<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOVE 클라이언트</title>
  <!-- 로드 순서: tokens → foundations → typography → 아이콘 → GNB → 셸 -->
  <link rel="stylesheet" href="css/tokens.css?v=7" />
  <link rel="stylesheet" href="css/foundations.css?v=7" />
  <link rel="stylesheet" href="css/typography.css?v=12" />
  <link rel="stylesheet" href="css/stds-font-icon.embedded.css?v=8" />
  <link rel="stylesheet" href="css/gnb.css?v=79" />
  <link rel="stylesheet" href="css/dashboard.css?v=16" />
  <style>
    /* 클라이언트 메인 = 실제 스토어 페이지(iframe). 원본 디자인 그대로.
       store.onstove.com 최상단 지엔비(.stove-gnb, 64px — 스토어/라운지/이벤트 등
       우리 사이드바 GNB와 중복되는 상단바)만 가려서 숨김: 크로스 오리진
       iframe이라 안쪽 DOM은 건드릴 수 없어서, iframe 자체를 -64px 위로
       올리고 그만큼 높이를 더 키운 다음 바깥 wrap에서 overflow:hidden으로
       잘라내는 방식(그 아래 카테고리 탭/본문은 그대로 보임). */
    .app > .main { overflow: hidden; }
    .store-frame-wrap { width: 100%; height: 100vh; overflow: hidden; position: relative; background: var(--background-variant-2); }
    .store-frame {
      position: absolute;
      top: -64px;
      left: 0;
      width: 100%;
      height: calc(100% + 64px);
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- ============ GNB (STOVE layout/GNB · Figma 5705:58393) ============
         공통 Vue 컴포넌트(js/gnb-component.js)가 마운트되는 자리.
         마크업은 이제 여기 하드코딩하지 않음 — 구조를 고치려면 그 파일 하나만 수정. -->
    <div id="gnb-mount"></div>

    <!-- ============ MAIN (store.onstove.com 임베드, 최상단 지엔비는 크롭) ============ -->
    <div class="main">
      <div class="store-frame-wrap">
        <iframe class="store-frame" src="https://store.onstove.com/ko" title="STOVE 스토어"></iframe>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/gnb-component.js?v=41"></script>
  <script>
    mountGnb('#gnb-mount');
  </script>
</body>
</html>
