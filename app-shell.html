<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOVE 클라이언트</title>
  <!-- 로드 순서: tokens → foundations → typography → 아이콘 → GNB → 셸 -->
  <link rel="stylesheet" href="css/tokens.css?v=7" />
  <link rel="stylesheet" href="css/foundations.css?v=7" />
  <link rel="stylesheet" href="css/typography.css?v=12" />
  <link rel="stylesheet" href="css/stds-font-icon.embedded.css?v=8" />
  <link rel="stylesheet" href="css/gnb.css?v=79" />
  <link rel="stylesheet" href="css/dashboard.css?v=16" />
  <style>
    /* 클라이언트 메인 = 스토어 페이지 정적 스크린샷(다크모드).
       처음엔 실제 store.onstove.com을 iframe으로 라이브 임베드했었는데:
       1) 최상단 지엔비·푸터는 크로스 오리진이라 크롭이 불가능하거나(푸터는
          콘텐츠 길이가 화면 폭마다 달라져서 고정 크롭이 다른 폭에서 깨짐),
       2) 다크모드도 "보는 사람 시스템 설정"을 그대로 따라가서, 시스템이
          라이트면 라이트로 뜨는 걸 부모 페이지에서 강제로 못 바꿈(크로스
          오리진 iframe 보안 경계라 CSS/쿠키 어느 쪽으로도 우회 불가, CORS도
          안 열려 있어 HTML을 가져와 고쳐 넣는 것도 불가능했음).
       → 라이브 임베드를 포기하고, 다크모드로 직접 캡처한 화면(최상단
       지엔비 제거, assets/store-preview-dark.jpg)을 정적 이미지로 넣음 —
       이러면 테마/크롭 둘 다 항상 의도한 대로 고정됨.
       클라이언트 최소 폭(1280, 사이드바 240 제외 1040)에 맞춰 1040px
       뷰포트로 캡처했고, width도 1040 고정 — 100%로 늘려서 더 넓은 화면에
       맞게 늘어나면(실제로 해보니 블러지고 내용도 부족해 보임) 안 되므로
       항상 이 1040 고정 크기로만 보여주고, 더 넓은 창에서는 옆에 배경색만
       추가로 보임(사이드바 폭이 고정인 것과 같은 방식).
       레티나 대응: 원본 파일 자체를 2x(2080px 폭, --force-device-scale-factor=2로
       캡처)로 만들어두고 CSS로는 1040px에 표시 — 그래서 고밀도(레티나) 디스플레이에서도
       안 흐려짐. */
    .app > .main {
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--background-variant-2);
      scrollbar-width: none; /* 네이티브 스크롤바 숨김 — 사이드바와 동일하게 커스텀 오버레이로 전부 대체 */
    }
    .app > .main::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .store-preview { display: block; width: 1040px; height: auto; }

    /* 커스텀 스크롤바 — 사이드바(.gnb-scrollbar/.gnb-scrollbar__thumb)와
       사이즈·위치(폭 0.4rem, 우측 여백 0.8rem) 완전히 동일한 규칙으로 재현.
       마우스가 .main 위에 있을 때만 노출, 색상도 동일(default=inverse-elevation-2,
       hover=inverse-elevation-1). JS로 썸 위치/높이 계산 (아래 스크립트 참고). */
    .main-scrollbar {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      bottom: 0.8rem;
      width: 0.4rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 6;
    }
    .main-scrollbar.is-visible { opacity: 1; }
    .main-scrollbar__thumb {
      position: absolute;
      left: 0;
      width: 100%;
      border-radius: var(--radius-full);
      background: var(--inverse-elevation-2);
    }
    .main-scrollbar__thumb:hover { background: var(--inverse-elevation-1); }
  </style>
</head>
<body>
  <div class="app">

    <!-- ============ GNB (STOVE layout/GNB · Figma 5705:58393) ============
         공통 Vue 컴포넌트(js/gnb-component.js)가 마운트되는 자리.
         마크업은 이제 여기 하드코딩하지 않음 — 구조를 고치려면 그 파일 하나만 수정. -->
    <div id="gnb-mount"></div>

    <!-- ============ MAIN (store 정적 스크린샷 — 다크모드 고정) ============ -->
    <div class="main" id="mainEl">
      <img class="store-preview" src="assets/store-preview-dark.jpg" alt="STOVE 스토어 (다크모드 미리보기)" />
      <div class="main-scrollbar" id="mainScrollbar">
        <div class="main-scrollbar__thumb" id="mainScrollbarThumb"></div>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/gnb-component.js?v=41"></script>
  <script>
    mountGnb('#gnb-mount');

    // .main 커스텀 스크롤바 — gnb-component.js의 updateThumb/마우스 호버 노출 로직과 동일한 방식(바닐라 JS)
    (function () {
      var mainEl = document.getElementById('mainEl');
      var track = document.getElementById('mainScrollbar');
      var thumb = document.getElementById('mainScrollbarThumb');
      if (!mainEl || !track || !thumb) return;

      function updateThumb() {
        var contentHeight = mainEl.scrollHeight;
        var visibleHeight = mainEl.clientHeight;
        if (contentHeight <= visibleHeight) {
          track.style.display = 'none';
          return;
        }
        track.style.display = 'block';
        var trackHeight = track.clientHeight;
        var h = Math.max((visibleHeight / contentHeight) * trackHeight, 24);
        var maxTop = trackHeight - h;
        var ratio = mainEl.scrollTop / (contentHeight - visibleHeight);
        thumb.style.height = h + 'px';
        thumb.style.top = (maxTop * ratio) + 'px';
      }

      function handleDocumentMouseMove(e) {
        var r = mainEl.getBoundingClientRect();
        var inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        track.classList.toggle('is-visible', inside);
      }

      function handleDocumentMouseLeave() {
        track.classList.remove('is-visible');
      }

      mainEl.addEventListener('scroll', updateThumb);
      window.addEventListener('resize', updateThumb);
      document.addEventListener('mousemove', handleDocumentMouseMove);
      document.addEventListener('mouseleave', handleDocumentMouseLeave);

      updateThumb();
    })();
  </script>
</body>
</html>
