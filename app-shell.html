<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOVE 클라이언트</title>
  <!-- 로드 순서: tokens → foundations → typography → 아이콘 → GNB → 셸 -->
  <link rel="stylesheet" href="css/tokens.css?v=7" />
  <link rel="stylesheet" href="css/foundations.css?v=7" />
  <link rel="stylesheet" href="css/typography.css?v=12" />
  <link rel="stylesheet" href="css/stds-font-icon.embedded.css?v=8" />
  <link rel="stylesheet" href="css/gnb.css?v=79" />
  <link rel="stylesheet" href="css/dashboard.css?v=16" />
  <style>
    /* 클라이언트 메인 = 실제 스토어 페이지(iframe). 원본 디자인 그대로.
       store.onstove.com 최상단 지엔비(.stove-gnb, 64px — 스토어/라운지/이벤트 등
       우리 사이드바 GNB와 중복되는 상단바)만 가려서 숨김: 크로스 오리진
       iframe이라 안쪽 DOM은 건드릴 수 없어서, iframe 자체를 -64px 위로
       올리고 그만큼 높이를 더 키운 다음 바깥 wrap에서 overflow:hidden으로
       잘라내는 방식(그 아래 카테고리 탭/본문은 그대로 보임).

       하단 푸터도 같은 이유(크로스 오리진이라 안쪽을 못 건드림)로 "콘텐츠
       끝 + 200px 여백"에서 그냥 잘라버림 — iframe 자체 높이를 실제 콘텐츠가
       끝나는 지점(오늘 기준 측정값, 2089px)으로 고정하고 scrolling="no"로
       그 밑(푸터)은 아예 렌더링 안 되게 한 다음, wrap을 그보다 200px 더
       크게 잡아서 빈 여백만 보이게 함.
       ※ 이 2089px는 오늘 store.onstove.com 콘텐츠 기준 하드코딩값이라, 저쪽
       프로모션 배너/섹션이 늘거나 줄면 다시 측정해서 바꿔줘야 함. */
    .app > .main { overflow-y: auto; overflow-x: hidden; }
    .store-frame-wrap {
      width: 100%;
      height: calc(2089px - 64px + 200px); /* 콘텐츠 끝(2089) - 위에서 크롭한 64 + 여백 200 */
      flex-shrink: 0; /* .main이 flex column이라 기본값(shrink:1)이면 768px짜리 뷰포트에 눌려버림 */
      overflow: hidden;
      position: relative;
      background: var(--background-variant-2);
    }
    .store-frame {
      position: absolute;
      top: -64px;
      left: 0;
      width: 100%;
      height: 2089px; /* 푸터 시작 지점에서 끊어서 그 아래(푸터)는 렌더링 자체가 안 되게 함 */
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- ============ GNB (STOVE layout/GNB · Figma 5705:58393) ============
         공통 Vue 컴포넌트(js/gnb-component.js)가 마운트되는 자리.
         마크업은 이제 여기 하드코딩하지 않음 — 구조를 고치려면 그 파일 하나만 수정. -->
    <div id="gnb-mount"></div>

    <!-- ============ MAIN (store.onstove.com 임베드, 최상단 지엔비는 크롭) ============
         credentialless: 이 스토어 사이트를 실제 브라우저에서 따로 방문해서
         라이트모드로 바꿔본 적 있는 사람은 COLOR_MODE=light 쿠키가 남아있어서
         임베드에도 그 쿠키가 그대로 전달돼 라이트로 뜸. credentialless면
         iframe이 그 도메인 쿠키를 아예 안 가져가고 "쿠키 없는 새 세션"으로
         취급돼서, 사이트 자체 기본값(다크)으로 항상 뜸 — 클라이언트는 다크
         기본이라는 요구사항과 맞음. -->
    <div class="main">
      <div class="store-frame-wrap">
        <iframe class="store-frame" src="https://store.onstove.com/ko" title="STOVE 스토어" credentialless scrolling="no"></iframe>
      </div>
    </div>

  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/gnb-component.js?v=41"></script>
  <script>
    mountGnb('#gnb-mount');
  </script>
</body>
</html>
